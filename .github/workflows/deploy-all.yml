name: CI/CD Pipeline (Backend & Frontend)

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  # Job 1: Tự động deploy Backend lên AWS EC2
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Connect and Update Backend on EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            # Tự động tìm thư mục chứa code backend trên EC2
            TARGET_DIR=$(find ~ -type d -name "*RecycleRewards*" 2>/dev/null | head -n 1)
            
            if [ -z "$TARGET_DIR" ]; then
              echo "Không tìm thấy thư mục project trên EC2!"
              exit 1
            fi

            echo "Đang deploy tại thư mục: $TARGET_DIR"
            if [ -d "$TARGET_DIR/RecycleRewards_BE" ]; then
              TARGET_DIR="$TARGET_DIR/RecycleRewards_BE"
            fi
            cd "$TARGET_DIR"

            git pull origin main || git pull origin dev
            npm install
            
            # Kiểm tra và tự động cài đặt PM2 nếu trên server chưa có
            export PATH=$PATH:/home/ubuntu/.npm/bin:/usr/bin:/usr/local/bin
            if ! command -v pm2 &> /dev/null; then
              echo "PM2 chưa được cài đặt, đang tiến hành cài đặt..."
              sudo npm install -g pm2
            fi
            
            # Restart hoặc start mới app nếu chưa tồn tại process recycle-backend
            if pm2 describe recycle-backend > /dev/null 2>&1; then
              pm2 restart recycle-backend
            else
              # Tự động tìm file khởi động chính (server.js hoặc app.js hoặc index.js)
              START_FILE="server.js"
              if [ -f "app.js" ]; then START_FILE="app.js"; fi
              if [ -f "index.js" ]; then START_FILE="index.js"; fi
              
              echo "Khởi động lần đầu với file: $START_FILE"
              pm2 start $START_FILE --name recycle-backend
            fi
            
            pm2 save
          EOF

  # Job 2: Tự động build và deploy Frontend lên Firebase Hosting
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./RecycleRewards_FE
        env:
          VITE_API_URL: https://recycle-rewards.duckdns.org/api
        run: |
          npm install
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECYCLE_REWARDS_2026 }}'
          channelId: live
          projectId: recycle-rewards-2026
          entryPoint: ./RecycleRewards_FE
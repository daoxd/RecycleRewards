name: CI/CD Pipeline (Backend & Frontend)

on:
  push:
    branches: [ "main", "dev"]

jobs:
  # Job 1: Tự động deploy Backend lên AWS EC2
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Connect and Update Backend on EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            cd ~/RecycleRewards_BE   # Trỏ đúng vào thư mục backend trên EC2
            git pull origin main
            npm install
            pm2 restart recycle-backend  # Tên process PM2 của bro
          EOF

  # Job 2: Tự động build và deploy Frontend lên Firebase Hosting
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend # (Tùy chọn) Chạy sau backend, hoặc để chạy song song bỏ dòng này đi
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: ./frontend   # Trỏ vào thư mục chứa code frontend
        run: |
          npm install
          npm run build                # Lệnh build ra file tĩnh (dist/build)

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_TOKEN }}'
          channelId: live
          projectId: recycle-rewards-2026
  # Thay bằng Project ID Firebase của bro
          entryPoint: ./frontend               # Chỉ định thư mục chạy firebase deploy
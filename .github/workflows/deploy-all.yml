name: CI/CD Pipeline (Backend & Frontend)

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  # Job 1: Tự động deploy Backend lên AWS EC2
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Connect and Update Backend on EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            # Tự động tìm thư mục chứa code backend trên EC2 (thay vì cố định tên)
            TARGET_DIR=$(find ~ -type d -name "*RecycleRewards*" 2>/dev/null | head -n 1)
            
            if [ -z "$TARGET_DIR" ]; then
              echo "Không tìm thấy thư mục project trên EC2!"
              exit 1
            fi

            echo "Đang deploy tại thư mục: $TARGET_DIR"
            cd "$TARGET_DIR"
            
            # Nếu monorepo có thư mục con backend, hãy un-comment dòng dưới:
            # cd backend

            git pull origin main || git pull origin dev
            npm install
            
            # Gọi pm2 an toàn tránh lỗi command not found
            export PATH=$PATH:/home/ubuntu/.npm/bin:/usr/bin:/usr/local/bin
            npx pm2 restart recycle-backend || pm2 restart recycle-backend || echo "Chưa chạy pm2 process, kiểm tra lại tên process!"
          EOF

  # Job 2: Tự động build và deploy Frontend lên Firebase Hosting
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: ./frontend   # Trỏ vào thư mục chứa code frontend
        run: |
          npm install
          npm run build                # Lệnh build ra file tĩnh

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_TOKEN }}'
          channelId: live
          projectId: recycle-rewards-2026
          entryPoint: ./frontend